name: reproduction-model-lb-shakedown

on:
  push:
    branches:
      - feat/v0.11-real-paper-generalization
    paths:
      - .github/workflows/reproduction-model-lb-shakedown.yml
      - benchmark/reproduction/cases/ssrn_7138278_model_lb_v1.3.1_v0.11.json
      - tests/test_reproduction_case_packets.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  author-package-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned public replication release
        shell: bash
        run: |
          set -euo pipefail
          export SRC=/tmp/model-lb-src
          git clone --quiet --no-tags https://github.com/ricardogs-econ/model-LB-replication.git "$SRC"
          git -C "$SRC" checkout --quiet --detach 4ea6e5e4c9cf2088aa76f406705f5620e561e199
          test "$(git -C "$SRC" rev-parse HEAD)" = "4ea6e5e4c9cf2088aa76f406705f5620e561e199"
          rm -rf "$SRC/.git"
          (
            cd "$SRC"
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > /tmp/model_lb_source_manifest.sha256
          echo "MODEL_LB_SOURCE_MANIFEST_SHA256=$(sha256sum /tmp/model_lb_source_manifest.sha256 | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "MODEL_LB_REQUIREMENTS_SHA256=$(sha256sum "$SRC/requirements.txt" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "MODEL_LB_LICENSE_SHA256=$(sha256sum "$SRC/LICENSE" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Build dependency-discovery image without external source code
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/model-lb.Dockerfile <<'EOF'
          FROM python:3.12-slim
          RUN python -m pip install --no-cache-dir --upgrade pip \
              && python -m pip install --no-cache-dir \
                 'numpy>=1.26,<3' \
                 'scipy>=1.11' \
                 'numba>=0.59' \
                 'matplotlib>=3.7' \
                 'joblib>=1.3' \
              && python -m pip freeze | sort > /environment.freeze.txt
          EOF
          docker build --quiet -f /tmp/model-lb.Dockerfile -t veritas-model-lb:discovery /tmp
          docker image inspect --format '{{.Id}}' veritas-model-lb:discovery > /tmp/model_lb_image_id.txt
          docker run --rm --entrypoint cat veritas-model-lb:discovery /environment.freeze.txt \
            > /tmp/model_lb_environment.freeze.txt
          echo "MODEL_LB_ENVIRONMENT_SHA256=$(sha256sum /tmp/model_lb_environment.freeze.txt | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Recompute empirical PPP table in network-disabled sandbox
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/model-lb-src
          OUT=/tmp/model-lb-out
          mkdir -p "$OUT/calib"
          cp "$SRC/boot_out/calib/surface_ppp_boot.csv" "$OUT/calib/surface_ppp_boot.csv"
          chmod -R a+rwX "$OUT"
          set +e
          timeout 900s docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --cpus 4 \
            --memory 8g \
            --shm-size 1g \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,size=2g \
            -e HOME=/tmp/home \
            -e NUMBA_CACHE_DIR=/tmp/numba \
            -e JOBLIB_TEMP_FOLDER=/tmp/joblib \
            -e MPLCONFIGDIR=/tmp/matplotlib \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$SRC:/work:ro" \
            -v "$OUT:/out:rw" \
            veritas-model-lb:discovery \
            python /work/boot_ppp_cbar.py \
              --empirical \
              --emp-dir /work \
              --out /out \
              --start-year 1973 \
              --n-jobs 4 \
            2>&1 | tee /tmp/model_lb_run.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > /tmp/model_lb_exit_code.txt
          test "$status" -eq 0
          test -f "$OUT/empirical/ppp_empirical.csv"

      - name: Build execution attestation artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          out = Path('/tmp/model-lb-out/empirical/ppp_empirical.csv')
          rows = list(csv.DictReader(out.open(encoding='utf-8')))
          cad = next(row for row in rows if row['currency'] == 'CAD')
          attestation = {
              'schema_version': 1,
              'case_id': 'ssrn-7138278-model-lb-v1.3.1',
              'track': 'author_package_environment_discovery_probe',
              'external_git_commit_sha': '4ea6e5e4c9cf2088aa76f406705f5620e561e199',
              'source_manifest_sha256': '${{ env.MODEL_LB_SOURCE_MANIFEST_SHA256 }}',
              'requirements_sha256': '${{ env.MODEL_LB_REQUIREMENTS_SHA256 }}',
              'license_sha256': '${{ env.MODEL_LB_LICENSE_SHA256 }}',
              'environment_freeze_sha256': '${{ env.MODEL_LB_ENVIRONMENT_SHA256 }}',
              'container_image_id': Path('/tmp/model_lb_image_id.txt').read_text().strip(),
              'output_artifact_sha256': hashlib.sha256(out.read_bytes()).hexdigest(),
              'target_id': 'cad-config-faithful-pvalue',
              'reproduced_value': float(cad['pvalue_cf']),
              'reproduced_reject_cal': int(cad['reject_cal']),
              'exit_code': int(Path('/tmp/model_lb_exit_code.txt').read_text()),
              'network_disabled': True,
              'source_mount_read_only': True,
              'veritas_repository_mounted': False,
              'credentials_mounted': False,
              'production_authorized': False,
              'e4_authorized': False,
              'note': 'Discovery probe only. Paper target remains sealed/orchestrator-only; dependency ranges are not yet a frozen production environment.'
          }
          Path('/tmp/model_lb_execution_attestation.json').write_text(
              json.dumps(attestation, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(attestation, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: model-lb-v1.3.1-author-package-probe
          if-no-files-found: error
          path: |
            /tmp/model_lb_execution_attestation.json
            /tmp/model_lb_environment.freeze.txt
            /tmp/model_lb_source_manifest.sha256
            /tmp/model_lb_run.log
            /tmp/model-lb-out/empirical/ppp_empirical.csv
