name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,pdf]'
      - run: ruff check src tests
      - run: pytest -q
      - run: python scripts/benchmark_pdf_regression.py
      - run: python scripts/benchmark_pdf_geometry_holdout.py
