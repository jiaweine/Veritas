name: product-audit-temp

on:
  push:
    branches:
      - product/conversation-neutral-shell
    paths:
      - .github/workflows/product-audit-temp.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: product/conversation-neutral-shell
      - name: Apply conversation-first neutral product migration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/product_conversation_patch_temp.py')
          text = path.read_text()
          start = text.index("app_text = app_text.replace(\n    '  $$(")
          end = text.index("old_boot = '''", start)
          path.write_text(text[:start] + text[end:])
          PY
          python scripts/product_conversation_patch_temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "product: make Veritas conversation-first and neutral"
          git push origin HEAD:product/conversation-neutral-shell
