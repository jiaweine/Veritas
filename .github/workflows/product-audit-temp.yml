name: product-audit-temp

on:
  push:
    branches:
      - product/conversation-neutral-shell
    paths:
      - .github/workflows/product-audit-temp.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: product/conversation-neutral-shell
      - name: Apply conversation-first neutral product migration
        run: |
          python scripts/product_conversation_patch_temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "product: make Veritas conversation-first and neutral"
          git push origin HEAD:product/conversation-neutral-shell
