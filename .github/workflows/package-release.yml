name: package-release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-smoke:
    runs-on: ubuntu-latest
    env:
      VERITAS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build wheel and source distribution
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build
      - name: Resolve package artifacts and version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist, found {wheels!r} / {sdists!r}")
          print(f"version={version}")
          print(f"wheel={wheels[0].resolve()}")
          print(f"sdist={sdists[0].resolve()}")
          PY
      - name: Inspect wheel and sdist contracts
        run: |
          set -euo pipefail
          python scripts/smoke_release_artifact.py \
            --wheel "${{ steps.package.outputs.wheel }}" \
            --sdist "${{ steps.package.outputs.sdist }}" \
            --expected-version "${{ steps.package.outputs.version }}" \
            --source-sha "$VERITAS_SOURCE_SHA" \
            | tee release-artifact-smoke.json
      - name: Install wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/veritas-release-smoke"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install \
            "${{ steps.package.outputs.wheel }}[pdf,attestation,web,replication,observability]"

          version="${{ steps.package.outputs.version }}"
          for command in \
            veritas-harness \
            veritas-replication \
            veritas-benchmark-result \
            veritas-workspace-retention
          do
            output=$("$venv/bin/$command" --version)
            printf '%s -> %s\n' "$command" "$output"
            case "$output" in
              *"$version"*) ;;
              *) echo "$command did not report package version $version" >&2; exit 1 ;;
            esac
          done

          "$venv/bin/python" - <<'PY'
          from importlib import resources
          from importlib.metadata import version

          if version("veritas-audit") != "${{ steps.package.outputs.version }}":
              raise SystemExit("installed distribution version drift")
          static_root = resources.files("veritas.harness").joinpath("static")
          for name in ("index.html", "app.js", "benchmarks.js", "sw.js"):
              candidate = static_root.joinpath(name)
              if not candidate.is_file():
                  raise SystemExit(f"installed wheel is missing static resource: {name}")
          PY
      - name: Upload validated package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: veritas-package-${{ env.VERITAS_SOURCE_SHA }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            release-artifact-smoke.json
          if-no-files-found: error
          retention-days: 30

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: artifact-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERITAS_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Require governed release identity
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version v$version" >&2
            exit 1
          fi
          VERSION="$version" python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^##\s+\[?{re.escape(version)}\]?(?:\s|$)"
          if re.search(pattern, text, flags=re.MULTILINE) is None:
              raise SystemExit(
                  f"CHANGELOG.md must contain a versioned level-2 section for {version} before tagging"
              )
          PY
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tagged commit $GITHUB_SHA is not contained in main history" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Rebuild and revalidate exact tagged artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build
          wheel=$(python - <<'PY'
          from pathlib import Path
          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels!r}")
          print(wheels[0])
          PY
          )
          sdist=$(python - <<'PY'
          from pathlib import Path
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(sdists) != 1:
              raise SystemExit(f"expected one sdist, found {sdists!r}")
          print(sdists[0])
          PY
          )
          python scripts/smoke_release_artifact.py \
            --wheel "$wheel" \
            --sdist "$sdist" \
            --expected-version "${{ steps.package.outputs.version }}" \
            --source-sha "$VERITAS_SOURCE_SHA"
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt)
      - name: Create immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; refusing to replace published assets" >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          This release packages the Veritas repository software and its CLI/Web assets.

          Source commit: \`$VERITAS_SOURCE_SHA\`

          A software release is **not** a production scientific-validation certificate. Synthetic AuditBench gates and the frozen v0.15 real-paper pilot retain their documented non-production authority boundaries. See \`docs/REPOSITORY_COMPLETION.md\`, \`docs/RELEASE_PROCESS.md\`, and \`CHANGELOG.md\` in this tag.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt \
            --verify-tag \
            --title "Veritas $GITHUB_REF_NAME" \
            --notes-file "$notes"
