name: projects-ui-smoke

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "src/veritas/harness/projects.py"
      - "src/veritas/harness/web.py"
      - "src/veritas/harness/static/projects.js"
      - "src/veritas/harness/static/projects-reference.js"
      - "src/veritas/harness/static/projects.css"
      - "src/veritas/harness/static/index.html"
      - "scripts/smoke_projects_browser.py"
      - "pyproject.toml"
      - ".github/workflows/projects-ui-smoke.yml"
  pull_request:
    paths:
      - "src/veritas/harness/projects.py"
      - "src/veritas/harness/web.py"
      - "src/veritas/harness/static/projects.js"
      - "src/veritas/harness/static/projects-reference.js"
      - "src/veritas/harness/static/projects.css"
      - "src/veritas/harness/static/index.html"
      - "scripts/smoke_projects_browser.py"
      - "pyproject.toml"
      - ".github/workflows/projects-ui-smoke.yml"

permissions:
  contents: read

jobs:
  chromium-projects-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install Veritas browser-smoke dependencies
        run: pip install -e '.[dev,pdf,web,browser]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start isolated Veritas harness
        run: |
          mkdir -p "$RUNNER_TEMP/veritas-projects-smoke"
          nohup veritas-harness \
            --host 127.0.0.1 \
            --port 8765 \
            --data-dir "$RUNNER_TEMP/veritas-projects-smoke/data" \
            > "$RUNNER_TEMP/veritas-projects-smoke/harness.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/veritas-projects-smoke/harness.pid"
      - name: Exercise persistent projects in real Chromium
        run: |
          python scripts/smoke_projects_browser.py \
            --base-url http://127.0.0.1:8765 \
            --output-dir artifacts/ui
      - name: Upload project workspace screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veritas-projects-ui-screenshot
          path: artifacts/ui/project-workspace.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload harness log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veritas-projects-smoke-log
          path: ${{ runner.temp }}/veritas-projects-smoke/harness.log
          if-no-files-found: warn
          retention-days: 14
