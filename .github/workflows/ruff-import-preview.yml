name: ruff-import-preview

on:
  push:
    branches: [feat/product-workbench-mobile]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.7
      - name: Print Ruff import fix
        run: |
          ruff check --select I001 --fix src/veritas/harness/web.py
          git diff -- src/veritas/harness/web.py
