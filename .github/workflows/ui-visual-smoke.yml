name: ui-visual-smoke

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "src/veritas/harness/**"
      - "scripts/smoke_harness_browser.py"
      - "pyproject.toml"
      - ".github/workflows/ui-visual-smoke.yml"
  pull_request:
    paths:
      - "src/veritas/harness/**"
      - "scripts/smoke_harness_browser.py"
      - "pyproject.toml"
      - ".github/workflows/ui-visual-smoke.yml"

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install Veritas browser-smoke dependencies
        run: pip install -e '.[dev,pdf,web,replication,browser]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start isolated Veritas harness
        run: |
          mkdir -p "$RUNNER_TEMP/veritas-ui-smoke"
          nohup veritas-harness \
            --host 127.0.0.1 \
            --port 8765 \
            --data-dir "$RUNNER_TEMP/veritas-ui-smoke/data" \
            > "$RUNNER_TEMP/veritas-ui-smoke/harness.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/veritas-ui-smoke/harness.pid"
      - name: Run real Chromium smoke and capture UI
        run: |
          python scripts/smoke_harness_browser.py \
            --base-url http://127.0.0.1:8765 \
            --output-dir artifacts/ui
      - name: Upload real UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-ui-screenshots
          path: artifacts/ui/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload harness log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-ui-smoke-log
          path: ${{ runner.temp }}/veritas-ui-smoke/harness.log
          if-no-files-found: warn
          retention-days: 14
