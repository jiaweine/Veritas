name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,pdf,attestation,web,replication]'
      - run: ruff check src tests
      - run: pytest -q
      - run: python scripts/run_benchmark_enveloped.py pdf-regression
      - run: python scripts/run_benchmark_enveloped.py pdf-geometry-holdout
      - name: Adversarial extraction fail-closed benchmark
        run: python scripts/run_benchmark_enveloped.py extraction-adversarial
      - name: BMC grouped regression-header probe (non-gating)
        continue-on-error: true
        run: python scripts/run_benchmark_enveloped.py bmc-grouped-headers
      - name: Real PDF extraction smoke (non-gating)
        continue-on-error: true
        run: python scripts/run_benchmark_enveloped.py real-pdf-smoke
      - name: Real PDF fail-closed controls (non-gating)
        continue-on-error: true
        run: python scripts/run_benchmark_enveloped.py real-pdf-fail-closed
      - name: Real PDF selective-promotion benchmark (non-gating)
        continue-on-error: true
        run: python scripts/run_benchmark_enveloped.py real-pdf-promotion
      - name: Upload benchmark result envelopes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: veritas-benchmark-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: .veritas-benchmark-results/*.json
          if-no-files-found: warn
          retention-days: 30
