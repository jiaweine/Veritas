name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,pdf]'
      - run: ruff check src tests
      - run: pytest -q
      - run: python scripts/benchmark_pdf_regression.py
      - run: python scripts/benchmark_pdf_geometry_holdout.py
      - name: Adversarial extraction fail-closed benchmark
        run: python scripts/benchmark_extraction_adversarial.py
      - name: Real PDF extraction smoke (non-gating)
        continue-on-error: true
        run: python scripts/smoke_real_pdf.py
      - name: Real PDF fail-closed controls (non-gating)
        continue-on-error: true
        run: python scripts/smoke_real_pdf_fail_closed.py
      - name: Real PDF selective-promotion benchmark (non-gating)
        continue-on-error: true
        run: python scripts/benchmark_real_pdf_promotion.py
