name: product-audit-temp

on:
  push:
    branches:
      - product/conversation-neutral-shell
    paths:
      - .github/workflows/product-audit-temp.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Audit active frontend assets and colors
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import colorsys
          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path('src/veritas/harness/static')
          html = (root / 'index.html').read_text()
          styles = re.findall(r'<link[^>]+href="/static/([^"]+\.css)"', html)
          scripts = re.findall(r'<script[^>]+src="/static/([^"]+\.js)"', html)
          print(f'ACTIVE_CSS_COUNT={len(styles)}')
          print('ACTIVE_CSS=' + ','.join(styles))
          print(f'ACTIVE_JS_COUNT={len(scripts)}')
          print('ACTIVE_JS=' + ','.join(scripts))

          blueish = Counter()
          locations = defaultdict(list)
          all_hex = Counter()
          pattern = re.compile(r'#[0-9a-fA-F]{6}\b')
          for name in styles + scripts:
              path = root / name
              if not path.exists():
                  print(f'MISSING_ASSET={name}')
                  continue
              text = path.read_text()
              for match in pattern.finditer(text):
                  value = match.group(0).lower()
                  all_hex[value] += 1
                  r, g, b = (int(value[i:i+2], 16) / 255 for i in (1, 3, 5))
                  h, s, v = colorsys.rgb_to_hsv(r, g, b)
                  deg = h * 360
                  # Include blue/indigo/cyan-purple boundary saturated accents; ignore near-neutrals.
                  if s >= .22 and 185 <= deg <= 270:
                      blueish[value] += 1
                      line = text.count('\n', 0, match.start()) + 1
                      if len(locations[value]) < 12:
                          locations[value].append(f'{name}:{line}')
          print(f'UNIQUE_HEX={len(all_hex)}')
          print(f'BLUEISH_UNIQUE={len(blueish)}')
          print(f'BLUEISH_OCCURRENCES={sum(blueish.values())}')
          for value, count in blueish.most_common():
              print(f'BLUEISH {value} x{count} ' + ' '.join(locations[value]))

          # Conversation/product architecture probes.
          app = (root / 'app.js').read_text()
          print('HAS_AGENT_MESSAGE_ENDPOINT=' + str('/messages' in app).lower())
          print('OVERVIEW_KPI_GRID=' + str('kpi-grid' in app).lower())
          print('OVERVIEW_CONVERSATION_COMPOSER=' + str('conversation-composer' in app).lower())
          print('AGENT_REQUIRES_ACTIVE_AUDIT=' + str('els.agentMessage.disabled = !audit' in app).lower())

          # Global layering hotspots: files with duplicate selector declarations across active CSS.
          selector_files = defaultdict(set)
          for name in styles:
              text = (root / name).read_text()
              for selector in re.findall(r'(?m)([^@{}][^{}]*)\{', text):
                  clean = ' '.join(selector.split())
                  if clean and len(clean) < 180:
                      selector_files[clean].add(name)
          overlaps = [(sel, files) for sel, files in selector_files.items() if len(files) >= 3]
          print(f'SELECTORS_DEFINED_IN_3PLUS_FILES={len(overlaps)}')
          for sel, files in sorted(overlaps, key=lambda item: (-len(item[1]), item[0]))[:40]:
              print('OVERLAP ' + sel + ' <- ' + ','.join(sorted(files)))
          PY
