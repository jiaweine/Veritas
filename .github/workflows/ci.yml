name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Verify active GitHub Actions are commit-pinned
        run: python scripts/check_github_action_pins.py
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,pdf,attestation,web,replication]'
      - run: ruff check src tests scripts/run_auditbench_v1.py scripts/run_auditbench_v02_pack.py scripts/check_github_action_pins.py
      - run: pytest -q
      - name: Locked AuditBench detector gate
        run: python scripts/run_benchmark_enveloped.py auditbench-v1
      - name: Locked AuditBench v0.2 detector pack
        run: python scripts/run_benchmark_enveloped.py auditbench-v02-pack
      - run: python scripts/run_benchmark_enveloped.py pdf-regression
      - run: python scripts/run_benchmark_enveloped.py pdf-geometry-holdout
      - name: Adversarial extraction fail-closed benchmark
        run: python scripts/run_benchmark_enveloped.py extraction-adversarial
      - name: BMC grouped regression-header probe (non-gating)
        continue-on-error: true
        run: python scripts/run_benchmark_enveloped.py bmc-grouped-headers
      - name: Real PDF extraction smoke (non-gating)
        continue-on-error: true
        run: python scripts/run_benchmark_enveloped.py real-pdf-smoke
      - name: Real PDF fail-closed controls (non-gating)
        continue-on-error: true
        run: python scripts/run_benchmark_enveloped.py real-pdf-fail-closed
      - name: Real PDF selective-promotion benchmark (non-gating)
        continue-on-error: true
        run: python scripts/run_benchmark_enveloped.py real-pdf-promotion
      - name: Upload benchmark result envelopes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: veritas-benchmark-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-result-envelopes/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload raw AuditBench reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: veritas-auditbench-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: auditbench-raw-reports/*.json
          if-no-files-found: warn
          retention-days: 30
