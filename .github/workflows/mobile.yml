name: mobile

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "mobile/**"
      - "src/veritas/harness/static/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "src/veritas/harness/static/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check workbench JavaScript syntax
        run: |
          node --check ../src/veritas/harness/static/app.js
          node --check ../src/veritas/harness/static/reproduction.js
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Expo dependency set
        run: npx expo install --check
      - name: Typecheck
        run: npx tsc --noEmit
