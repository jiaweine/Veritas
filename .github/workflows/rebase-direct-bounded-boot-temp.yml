name: rebase-direct-bounded-boot-temp

on:
  push:
    branches:
      - "work/rebase-direct-bounded-boot"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/rebase-direct-bounded-boot
          fetch-depth: 0
      - name: Apply bounded boot change onto current main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin 40ebcf9c142b62d248341e877d1df0e2ebf526b9
          git cherry-pick --no-commit 40ebcf9c142b62d248341e877d1df0e2ebf526b9
          git restore --source=HEAD -- .github/workflows/mobile.yml
          git add -A
          git commit -m "fix: port direct bounded product boot onto current main"
          git push origin HEAD:work/rebase-direct-bounded-boot
